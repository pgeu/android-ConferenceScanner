apply plugin: 'com.android.application'

def skipSigningProp = project.hasProperty("skipSigning")

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "eu.postgresql.android.conferencescanner"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 107009
        versionName "1.7.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (!skipSigningProp) {
               def storePath = System.getenv("SIGNING_STORE_FILE")
               storeFile storePath ? file(storePath) : null
               storePassword System.getenv("SIGNING_STORE_PASSWORD")
               keyAlias System.getenv("SIGNING_KEY_ALIAS")
               keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (skipSigningProp) {
               signingConfig null
            } else {
               signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources = false
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        // https://developer.android.com/build/jdks#compileSdk
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lintOptions {
        checkReleaseBuilds = false
    }
    namespace = 'eu.postgresql.android.conferencescanner'

    tasks.withType(JavaCompile){
        options.compilerArgs <<"-Xlint:deprecation"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    implementation 'com.android.volley:volley:1.2.1'

    implementation "androidx.camera:camera-core:1.6.1"
    implementation "androidx.camera:camera-camera2:1.6.1"
    implementation "androidx.camera:camera-lifecycle:1.6.1"
    implementation "androidx.camera:camera-view:1.6.1"

    implementation "androidx.concurrent:concurrent-futures:1.3.0"

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
