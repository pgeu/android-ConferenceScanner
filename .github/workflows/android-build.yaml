name: Bulid android bundle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Verify version code
      run: |
        EXPECTEDVER=`sed -n 's/.*versionName "\([0-9]\)\.\([0-9]\)\.\([0-9]\)".*/\10\200\3/p' app/build.gradle`
        ACTUALVER=`sed -n 's/.*versionCode \([0-9]\+\).*/\1/p' app/build.gradle`
        if [ "$EXPECTEDVER" != "$ACTUALVER" ]; then
          echo "Expected version code ${EXPECTEDVER}, got ${ACTUALVER}"
          exit 1
        fi

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: "17"
        distribution: temurin
        cache: gradle

    - name: Clean
      run: ./gradlew clean

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v7
      with:
        name: apks
        path: "app/build/outputs/apk/release/*.apk"

    - name: Bulid bundle
      run: ./gradlew bundleRelease --warning-mode all

    - name: Upload bundle artifacts
      uses: actions/upload-artifact@v7
      with:
        name: bundles
        path: "app/build/outputs/bundle/release/*.aab"
