name: Publish to Play store alpha channel

on:
  push:
    tags: ['REL_*']

permissions:
  contents: read

jobs:
  publish:
    environment: deploy
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: eu.postgresql.android.conferencescanner
      TRACK: alpha
      AAB: app/build/outputs/bundle/release/app-release.aab

    steps:
      - uses: actions/checkout@v4

      - name: Verify version code and tag name
        run: |
          EXPECTEDVER=`sed -n 's/.*versionName "\([0-9]\)\.\([0-9]\)\.\([0-9]\)".*/\10\200\3/p' app/build.gradle`
          ACTUALVER=`sed -n 's/.*versionCode \([0-9]\+\).*/\1/p' app/build.gradle`
          if [ "$EXPECTEDVER" != "$ACTUALVER" ]; then
             echo "Expected version code ${EXPECTEDVER}, got ${ACTUALVER}"
             exit 1
          fi
          EXPECTEDTAG=`sed -n 's/.*versionName "\([0-9]\)\.\([0-9]\)\.\([0-9]\)".*/refs\/tags\/REL_\1_\2_\3/p' app/build.gradle`
          if [ "$EXPECTEDTAG" != "$GITHUB_REF" ]; then
             echo "Expected tag name ${EXPECTEDTAG}, got ${GITHUB_REF}"
             exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ls -l "$RUNNER_TEMP/upload.jks"
          md5sum "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Play and release to track
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          UPLOAD="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME"

          api() {
            local out status
            out=$(mktemp)
            status=$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$@")
            if [ "$status" -ge 400 ]; then
              echo "::error::HTTP $status from ${@: -1}" >&2
              cat "$out" >&2
              return 1
            fi
            cat "$out"
          }

          echo "Creating edit"
          EDIT_ID=$(api -X POST "$API/edits" | jq -r .id)

          echo "Uploading bundle"
          VERSION_CODE=$(api -X POST -H "Content-Type: application/octet-stream" \
            --data-binary @"$AAB" \
            "$UPLOAD/edits/$EDIT_ID/bundles?uploadType=media" | jq -r .versionCode)
          echo "Uploaded versionCode $VERSION_CODE"

          echo "Assigning to track $TRACK"
          NAME=`sed -n 's/.*versionName "\([0-9]\.[0-9]\.[0-9]\)".*/\1/p' app/build.gradle`
          if [ -f "releasenotes/$NAME.txt" ]; then
             cp "releasenotes/$NAME.txt" release-notes.txt
          else
             echo "Various bug fixes and improvements" > release-notes.txt
          fi
          jq -n --arg track "$TRACK" --arg vc "$VERSION_CODE" --arg name "$NAME" --rawfile notes release-notes.txt  \
            '{track: $track, releases: [{name: $name, versionCodes: [$vc], status: "completed", releaseNotes: [{language: "en-US", text: ($notes | sub("\\s+$"; "") | .[0:500])}]}]}' > release.json
          api -X PUT -H "Content-Type: application/json" --data @release.json \
            "$API/edits/$EDIT_ID/tracks/$TRACK" > /dev/null

          echo "Committing edit"
          api -X POST "$API/edits/$EDIT_ID:commit" > /dev/null
